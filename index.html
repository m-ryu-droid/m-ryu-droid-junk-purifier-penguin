<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャンク世界の浄化者</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container">
    <h1>ジャンク世界の浄化者</h1>
    
    <div id="status-board" style="background: rgba(255,255,255,0.8); border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 2px solid #81d4fa;">
        <div style="display: flex; justify-content: space-around; font-weight: bold;">
            <div>浄化Pt: <span id="total-pt-display" style="color: #0288d1; font-size: 1.2em;">0</span></div>
            <div>ボスまで: <span id="boss-distance" style="color: #ef4444;">30</span> pt</div>
        </div>
        <div style="width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-top: 10px; overflow: hidden;">
            <div id="purify-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #4fc3f7, #0288d1); transition: width 0.5s;"></div>
        </div>
    </div>

    <div id="penguin-img-container"><img src="penguin.png" alt="ペンペン"></div>
    
    <div id="message-area">
        <p id="message">ご飯の写真を撮って、海を浄化するっピ！</p>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="camera" style="display:none;">
    <button id="upload-btn" onclick="document.getElementById('camera-input').click()">📷 写真を撮る</button>
    
    <div id="result"></div>
</div>

        <div id="result" style="margin-top:20px; font-weight:bold;"></div>

        
    </div>
    <script src="script.js"></script>
</body>
</html>
