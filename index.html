<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="main-screen">
            <h1>テスト２</h1>
            <div class="status-board">
                <div style="display: flex; justify-content: space-around;">
                    <div>浄化Pt: <span id="total-pt-display">0</span></div>
                    <div>ボスまで: <span id="boss-distance">30</span> pt</div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="purify-bar"></div>
                </div>
                <div style="display: flex; justify-content: space-around; font-size: 0.8em; color: #666;">
                    <div>現在: <span id="current-weight">--</span></div>
                    <div>目標まで: <span id="weight-diff">--</span></div>
                </div>
            </div>

<div id="main-penguin-stage" style="
    position: relative; 
    width: 200px;           /* 160pxから200pxに大きくする */
    height: 200px;          /* 四角にする */
    margin: 20px auto; 
    background: white; 
    border-radius: 20px;    /* 完全な丸(50%)から、少し角の丸い四角(20px)にする */
    border: 4px solid #b3e5fc; 
    display: flex; 
    align-items: flex-end;  /* ペンギンを下に配置する */
    justify-content: center; 
    overflow: hidden;       /* ステージからはみ出た部分（例えば帽子の下部）を隠す */
">
    <img src="penguin.png" style="
        width: 100%;        /* 80%から100%にして、枠いっぱいに表示する */
        position: relative; 
        z-index: 1;
    ">
    
    <img id="main-hat" src="" style="
        position: absolute; 
        width: 70%;         /* 幅を調整（帽子の形に合わせて微調整してだっピ） */
        height: auto; 
        top: 10px;          /* ステージの上端から少し下に配置する */
        left: 15%;          /* 真ん中に来るように調整 (100% - 70%) / 2 */
        z-index: 2;         /* ペンギンの上に表示する */
        pointer-events: none;
    ">
</div>

            <p id="message">🐧「今日は何を食べたの？」</p>
            <div id="result"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="upload-btn" class="btn-blue" style="flex: 2;">写真を撮る</button>
                <button onclick="openWeightInput()" class="btn-pink" style="flex: 1;">⚖️ 体重</button>
            </div>
            
            <div style="margin-top: 20px;">
                <button onclick="toggleScreen('closet')" style="background: none; border: 1px solid #ccc; border-radius: 15px; padding: 5px 15px; color: #666; font-size: 0.8em; cursor: pointer;">クローゼットへ行く 👗</button>
            </div>
        </div>

        <div id="closet-screen" style="display: none;">
            <h2 style="color: #0277bd;">おきがえルーム</h2>
            <div id="closet-items" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px;"></div>
            <button onclick="toggleScreen('main')" class="btn-blue">決定！</button>
        </div>
    </div>
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
    <script src="script.js"></script>
</body>
</html>
