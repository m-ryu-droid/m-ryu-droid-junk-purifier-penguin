<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャンク世界の浄化者</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container">
    <h1>ジャンク世界の浄化者</h1>
    
    <div id="status-board" style="background: rgba(255,255,255,0.8); border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 2px solid #81d4fa;">
       <div style="display: flex; justify-content: space-around; font-weight: bold; margin-bottom:10px;">
        <div>浄化Pt: <span id="total-pt-display">0</span></div>
        <div>ボスまで: <span id="boss-distance">30</span> pt</div>
    </div>
    
    <div style="display: flex; justify-content: space-around; font-size: 0.9em; border-top: 1px solid #eee; padding-top: 10px;">
        <div>現在: <span id="current-weight">--</span> kg</div>
        <div>目標まで: <span id="weight-diff">--</span> kg</div>
    </div>
    
    <div id="progress-container" ...>
        <div id="purify-bar" ...></div>
    </div>
    </div>

    <div id="penguin-img-container"><img src="penguin.png" alt="ペンペン"></div>
    
    <div id="message-area">
        <p id="message">ご飯の写真を撮って、海を浄化するっピ！</p>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="camera" style="display:none;">
    <button id="upload-btn" onclick="document.getElementById('camera-input').click()">📷 写真を撮る</button>
    
    <div id="result"></div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
