<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<body>
    <div class="container">
        <div id="main-screen">
            <h1>テスト8</h1>
            <div class="status-board">
                </div>

            <div style="position: relative; width: 100%; max-width: 300px; margin: 0 auto;">
                <img src="assets/penguin.png" id="main-penguin-img" style="width: 100%; height: auto; position: relative;">
                <img id="main-hat" src="" style="position: absolute; width: 70%; height: auto; z-index: 2; top: 33%; left: 50%; transform: translateX(-50%); pointer-events: none;">
            </div>

            <p id="message">🐧「今日は何を食べたの？」</p>
            <div id="result"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="upload-btn" class="btn-blue" style="flex: 2;">写真を撮る</button>
                <button onclick="openWeightInput()" class="btn-pink" style="flex: 1;">⚖️ 体重</button>
            </div>
            
            <div style="margin-top: 20px;">
                <button onclick="toggleScreen('closet')" style="background: none; border: 1px solid #ccc; border-radius: 15px; padding: 5px 15px; color: #666; font-size: 0.8em; cursor: pointer;">クローゼットへ行く 👗</button>
            </div>
        </div>

        <div id="closet-screen" class="hidden">
            <h2 style="color: #0277bd;">おきがえルーム</h2>
            
            <div style="position: relative; width: 150px; margin: 0 auto 20px;">
                <img src="assets/penguin.png" id="closet-penguin-img" style="width: 100%; height: auto;">
                <img id="closet-hat" src="" style="position: absolute; width: 70%; height: auto; z-index: 2; top: 33%; left: 50%; transform: translateX(-50%);">
            </div>

            <div id="item-grid" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px;"></div>
            
            <button onclick="toggleScreen('main')" class="btn-blue">決定！</button>
        </div>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">

    <script src="config.js"></script>
    <script src="ui-controller.js"></script>
    <script src="app-logic.js"></script>
</body>
