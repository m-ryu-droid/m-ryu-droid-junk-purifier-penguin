<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ペンギン浄化アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <div id="main-screen">
            <h1>テスト18</h1>
            
            <div class="status-board">
                <div style="display: flex; justify-content: space-around; margin-bottom: 5px;">
                    <div style="font-weight: bold;">浄化Pt: <span id="total-pt-display">0</span></div>
                    <div style="font-size: 0.9em; color: #555;">ボスまで: <span id="boss-distance">30</span> pt</div>
                </div>
                <div class="progress-container" style="background: #e0f2f1; border-radius: 10px; height: 12px; margin: 10px 0; overflow: hidden;">
                    <div class="progress-bar" id="purify-bar" style="background: #4db6ac; width: 0%; height: 100%; transition: width 0.3s ease;"></div>
                </div>
                <div style="display: flex; justify-content: space-around; font-size: 0.8em; color: #666;">
                    <div>現在: <span id="current-weight">--</span></div>
                    <div>目標まで: <span id="weight-diff">--</span></div>
                </div>
            </div>

            <div style="position: relative; width: 320px; margin: -10px auto 10px;">
                <img src="assets/penguin.png" id="main-penguin-img" style="width: 100%; height: auto; position: relative; z-index: 1;">
                
                <img id="main-body" src="" style="position: absolute; width: 100%; height: auto; z-index: 2; top: 0; left: 0; pointer-events: none; display: none;">
                
                <img id="main-hat" src="" style="position: absolute; width: 70%; height: auto; z-index: 3; top: 33%; left: 50%; transform: translateX(-50%); pointer-events: none; display: none;">
            </div>

            <p id="message" class="serif-text-element">🐧「今日は何を食べたの？」</p>
            <div id="result"></div>

            <div class="main-action-group">
                <button id="upload-btn" class="btn-blue">📸 写真を撮って海を浄化する</button>
                <button onclick="openWeightInput()" class="btn-pink">⚖️ 体重を記録する</button>
            </div>
            
            <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 350px;">
        <button onclick="goToRoom()" style="padding: 12px; border-radius: 25px; border: none; background: #ffffff; color: #0288d1; font-weight: bold; cursor: pointer; font-size: 1em; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 8px;">
            🏠 ペンギンのお部屋へいく
        </button>
    </div>

    <div id="penguin-room" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('assets/room_bg.png') no-repeat center center; background-size: cover; z-index: 100; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 40px; box-sizing: border-box;">
        
        <div style="position: absolute; top: 20px; background: rgba(255,255,255,0.85); padding: 6px 16px; border-radius: 20px; font-weight: bold; color: #0288d1; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
            🐧 ペンギンのお部屋
        </div>

        <button onclick="leaveRoom()" style="position: absolute; top: 20px; left: 20px; padding: 8px 12px; border-radius: 15px; border: none; background: #333; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.85em; opacity: 0.8;">
            ◀ もどる
        </button>

        <div style="display: flex; gap: 20px; width: 90%; max-width: 320px; margin-bottom: 20px;">
            <button onclick="openClosetFromRoom()" style="flex: 1; padding: 20px 10px; border-radius: 15px; border: 3px solid #81d4fa; background: rgba(255,255,255,0.9); color: #0288d1; font-weight: bold; cursor: pointer; box-shadow: 0 6px 12px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <span style="font-size: 1.8em;">👗</span>
                クローゼット
            </button>
            
            <button onclick="openZukanFromRoom()" style="flex: 1; padding: 20px 10px; border-radius: 15px; border: 3px solid #81d4fa; background: rgba(255,255,255,0.9); color: #0288d1; font-weight: bold; cursor: pointer; box-shadow: 0 6px 12px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <span style="font-size: 1.8em;">📖</span>
                食材図鑑
            </button>
        </div>

        <div id="zukan-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; box-sizing: border-box; padding: 20px;">
        
        <div style="background: #ffffff; width: 100%; max-width: 340px; height: 85%; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; border: 4px solid #81d4fa; box-shadow: 0 8px 24px rgba(0,0,0,0.3);">
            
            <div style="background: #81d4fa; color: #0288d1; padding: 12px; text-align: center; font-weight: bold; font-size: 1.1em; display: flex; justify-content: space-between; align-items: center;">
                <span>📖 しょくざい図鑑</span>
                <button onclick="closeZukan()" style="border: none; background: #0288d1; color: white; border-radius: 50%; width: 26px; height: 26px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;">×</button>
            </div>

            <div id="zukan-badge-area" style="background: #e1f5fe; padding: 8px 15px; font-size: 0.85em; color: #0277bd; font-weight: bold; border-bottom: 1px solid #b3e5fc; text-align: center;">
                見つけた食材: <span id="zukan-progress-count">0</span> / 10 種類
            </div>

            <div id="zukan-grid" style="flex: 1; padding: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; overflow-y: auto; background: #fafafa;">
                </div>

        </div>
    </div>

    <div id="zukan-detail-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 300; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;">
        <div style="background: white; border-radius: 15px; width: 85%; max-width: 280px; padding: 20px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.2); position: relative; border: 3px solid #0288d1;">
            <div id="detail-image" style="font-size: 3em; margin-bottom: 10px;">🥑</div>
            <h3 id="detail-name" style="margin: 0 0 10px 0; color: #0288d1;">食材名</h3>
            <p id="detail-count" style="margin: 0 0 10px 0; font-size: 0.85em; font-weight: bold; color: #ff5252; background: #ffebee; display: inline-block; padding: 2px 10px; border-radius: 10px;">食べた回数: 0回</p>
            <p id="detail-desc" style="margin: 0; font-size: 0.85em; color: #555; text-align: left; line-height: 1.4; background: #f9f9f9; padding: 8px; border-radius: 8px;">ここに解説文が入るっピ！</p>
            <button onclick="closeZukanDetail()" style="margin-top: 15px; padding: 8px 20px; border-radius: 15px; border: none; background: #0288d1; color: white; font-weight: bold; cursor: pointer;">とじる</button>
        </div>
    </div>

    </div> 
    
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">

    <script src="config.js"></script>
    <script src="background-controller.js"></script> 
    <script src="ui-controller.js"></script>
    <script src="app-logic.js"></script>

</body>
</html>
