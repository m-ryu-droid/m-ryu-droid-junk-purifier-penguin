<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャンク世界の浄化者</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="main-screen">
            <h1>ジャンク世界の浄化者</h1>
            <div class="status-board"> ... </div> 

            <div id="main-penguin-stage" style="position: relative; width: 150px; margin: 20px auto;">
                <img src="penguin.png" style="width: 100%;">
                <img id="main-hat" src="" style="position: absolute; top: 0; left: 0; width: 100%; pointer-events: none;">
                <img id="main-body" src="" style="position: absolute; top: 0; left: 0; width: 100%; pointer-events: none;">
            </div>

            <p id="message">ご飯の写真を撮って、海を浄化するっピ！</p>
            <div id="result"></div>

            <div class="button-group">
                <button id="upload-btn" class="btn-blue">写真を撮る</button>
                <button onclick="openWeightInput()" class="btn-pink">⚖️ 体重</button>
            </div>
            
            <button onclick="toggleScreen('closet')" style="margin-top: 20px; background: none; border: 1px solid #ccc; border-radius: 5px; cursor: pointer;">クローゼットへ行く👗</button>
        </div>

        <div id="closet-screen" style="display: none; text-align: center;">
            <h2 style="color: #0288d1;">おきがえルーム</h2>
            
            <div id="closet-penguin-stage" style="position: relative; width: 200px; margin: 20px auto; background: #f0f8ff; border-radius: 50%; padding: 20px;">
                <img src="penguin.png" style="width: 100%;">
                <img id="closet-hat" src="" style="position: absolute; top: 20px; left: 20px; width: 200px; pointer-events: none;">
                <img id="closet-body" src="" style="position: absolute; top: 20px; left: 20px; width: 200px; pointer-events: none;">
            </div>

            <p style="font-size: 0.8em; color: #666;">アンロックされた装備だっピ！</p>
            <div id="closet-items" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;">
                </div>

            <button onclick="toggleScreen('main')" class="btn-blue" style="width: auto; padding: 10px 30px;">決定して戻る</button>
        </div>
    </div>
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
</body>
</html>
